name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Migration smoke test
        env:
          APP_ENV: development
          SECRET_KEY: ci-secret-key-not-for-production
          DB_PATH: ./ci-migrate.db
        run: |
          python manage.py migrate
          python manage.py status

      - name: Tests with coverage
        run: pytest --cov=warfarin --cov-report=term --cov-fail-under=75

      - name: Application boot check
        env:
          APP_ENV: development
          SECRET_KEY: ci-secret-key-not-for-production
          DB_PATH: ./ci-boot.db
          ENABLE_SCHEDULER: "0"
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from warfarin.app_factory import create_app
          with TestClient(create_app()) as client:
              assert client.get('/ping').status_code == 200
              assert client.get('/login').status_code == 200
              assert client.get('/education').status_code == 200
          print('boot check passed')
          "
