[project]
name = "warfarin-tracker"
version = "2.0.0"
description = "ระบบติดตามการกินยาวาร์ฟาริน — Warfarin Medication Tracker"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "static"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "ARG"]
ignore = [
    "E501",    # long lines are handled by the formatter, not the linter
    "B008",    # FastAPI's Depends()/Form() defaults are the documented idiom
    "B904",    # re-raising with `from` adds noise in the request handlers
    "SIM105",  # contextlib.suppress is less readable than try/except: pass here
    "ARG001",  # FastAPI injects `user`/`request` args routes do not always read
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "ARG001", "ARG002", "ARG005", "F401", "C420"]
"warfarin/line_service.py" = ["F401"]  # optional SDK symbols re-exported by name

[tool.ruff.lint.isort]
known-first-party = ["warfarin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
]

[tool.coverage.run]
source = ["warfarin"]
omit = ["warfarin/rich_menu.py", "tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
