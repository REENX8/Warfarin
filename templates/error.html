<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกิดข้อผิดพลาด {{ status_code }} | ระบบติดตามวาร์ฟาริน</title>
    <link rel="stylesheet" href="/static/css/app.css">
    <style>
        body { display:flex; align-items:center; justify-content:center; padding:24px; }
        .box { background:#fff; border:1px solid #E2E8F0; border-radius:16px; padding:36px 32px;
               max-width:440px; width:100%; text-align:center; box-shadow:0 4px 16px rgba(15,27,40,.07); }
        .code { font-size:52px; font-weight:800; color:#0284C7; line-height:1; }
        h1 { font-size:19px; margin:12px 0 8px; }
        p { font-size:14px; color:#64748B; line-height:1.7; margin-bottom:22px; }
        a { display:inline-block; padding:11px 22px; border-radius:10px; background:#0B1F36;
            color:#fff; text-decoration:none; font-size:14px; font-weight:600; }
    </style>
</head>
<body>
<div class="box">
    <div class="code">{{ status_code }}</div>
    <h1>
        {% if status_code == 404 %}ไม่พบหน้าที่ต้องการ
        {% elif status_code == 403 %}ไม่มีสิทธิ์เข้าถึง
        {% elif status_code == 429 %}เรียกใช้งานถี่เกินไป
        {% elif status_code >= 500 %}ระบบขัดข้อง
        {% else %}เกิดข้อผิดพลาด{% endif %}
    </h1>
    <p>{{ detail }}</p>
    <a href="/dashboard">กลับหน้าหลัก</a>
</div>
</body>
</html>
