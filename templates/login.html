<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>เข้าสู่ระบบ | ระบบติดตามวาร์ฟาริน</title>
    <link rel="stylesheet" href="/static/css/app.css">
    <script defer src="/static/js/app.js"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-sky-600 rounded-2xl mb-4 shadow-lg shadow-sky-200">
                <svg class="w-8 h-8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">ระบบติดตามการกินยาวาร์ฟาริน</h1>
            <p class="text-slate-500 mt-1">{{ hospital_name }}</p>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
            <h2 class="text-lg font-semibold text-slate-700 mb-6">เข้าสู่ระบบสำหรับเจ้าหน้าที่</h2>

            {% if error %}
            <div class="mb-5 p-3.5 bg-rose-50 border border-rose-200 rounded-lg flex items-start gap-2" role="alert">
                <svg class="w-5 h-5 text-rose-500 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span class="text-sm text-rose-700">{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" action="/login" class="space-y-5">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <input type="hidden" name="next" value="{{ next }}">

                <div>
                    <label for="username" class="block text-sm font-medium text-slate-700 mb-1.5">ชื่อผู้ใช้</label>
                    <input type="text" id="username" name="username" required autocomplete="username" autofocus
                        class="w-full px-4 py-2.5 rounded-lg border border-slate-300 text-sm text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500"
                        placeholder="กรอกชื่อผู้ใช้">
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700 mb-1.5">รหัสผ่าน</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password"
                        class="w-full px-4 py-2.5 rounded-lg border border-slate-300 text-sm text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500"
                        placeholder="กรอกรหัสผ่าน">
                </div>

                <button type="submit"
                    class="w-full py-2.5 px-4 bg-sky-600 hover:bg-sky-700 text-white text-sm font-semibold rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-sky-500">
                    เข้าสู่ระบบ
                </button>
            </form>
        </div>

        <div class="mt-6 text-center space-y-2">
            <a href="/education" class="text-xs text-sky-600 hover:underline">คู่มือผู้ป่วยวาร์ฟาริน (สำหรับผู้ป่วยและญาติ)</a>
            <p class="text-xs text-slate-400">ระบบติดตามการกินยาวาร์ฟาริน · {{ hospital_name }}</p>
        </div>
    </div>

</body>
</html>
