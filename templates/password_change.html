{% extends "base.html" %}
{% block title %}เปลี่ยนรหัสผ่าน{% endblock %}
{% block content %}
<div class="max-w-md mx-auto space-y-5">

    <div>
        <a href="/dashboard" class="text-sm font-medium" style="color:#0284C7;">&larr; กลับแดชบอร์ด</a>
        <h1 class="text-xl font-bold mt-2" style="color:#0F1923;">เปลี่ยนรหัสผ่าน</h1>
        <p class="text-sm mt-1" style="color:#8A9BAA;">สำหรับบัญชี: <strong>{{ user.username }}</strong></p>
    </div>

    {% if error %}
    <div class="rounded-lg p-4 text-sm font-medium" style="background:#FEF2F2; color:#991B1B; border:1px solid #FECACA;">
        {{ error }}
    </div>
    {% endif %}

    {% if success %}
    <div class="rounded-lg p-4 text-sm font-medium" style="background:#ECFDF5; color:#065F46; border:1px solid #A7F3D0;">
        {{ success }}
    </div>
    {% endif %}

    <form method="POST" action="/profile/password" class="card p-6 space-y-4">
        <div>
            <label class="block text-sm font-medium mb-1" style="color:#374151;">รหัสผ่านปัจจุบัน <span style="color:#DC2626;">*</span></label>
            <input type="password" name="current_password" required
                   class="w-full rounded-lg border px-3 py-2.5 text-sm" style="border-color:#CBD5E1;">
        </div>
        <div>
            <label class="block text-sm font-medium mb-1" style="color:#374151;">รหัสผ่านใหม่ <span style="color:#DC2626;">*</span></label>
            <input type="password" name="new_password" required minlength="8"
                   class="w-full rounded-lg border px-3 py-2.5 text-sm" style="border-color:#CBD5E1;"
                   placeholder="อย่างน้อย 8 ตัวอักษร">
        </div>
        <div>
            <label class="block text-sm font-medium mb-1" style="color:#374151;">ยืนยันรหัสผ่านใหม่ <span style="color:#DC2626;">*</span></label>
            <input type="password" name="confirm_password" required minlength="8"
                   class="w-full rounded-lg border px-3 py-2.5 text-sm" style="border-color:#CBD5E1;">
        </div>
        <button type="submit" class="btn btn-primary w-full justify-center mt-2">
            บันทึกรหัสผ่านใหม่
        </button>
    </form>

</div>
{% endblock %}
