<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ส่งรายงานอาการ | รพ.สุไหงปาดี</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-b from-emerald-50 to-white min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm text-center">
        <div class="inline-flex items-center justify-center w-20 h-20 bg-emerald-100 rounded-full mb-4">
            <svg class="w-10 h-10 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
            </svg>
        </div>
        <h1 class="text-2xl font-bold text-slate-800 mb-2">ส่งรายงานสำเร็จ</h1>
        <p class="text-slate-600 mb-6">เจ้าหน้าที่ได้รับข้อมูลของคุณแล้ว</p>

        {% if severity >= 4 %}
        <div class="bg-rose-50 border border-rose-200 rounded-xl p-4 text-sm text-rose-700">
            ⚠️ อาการของคุณอาจต้องการการดูแลเร่งด่วน<br>
            กรุณาพบแพทย์หรือติดต่อ รพ.สุไหงปาดี ทันที
        </div>
        {% else %}
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 text-sm text-slate-600">
            เภสัชกรหรือพยาบาลจะติดต่อกลับเพื่อให้คำแนะนำ
        </div>
        {% endif %}

        <p class="text-center text-xs text-slate-400 mt-8">ระบบติดตามยาวาร์ฟาริน | รพ.สุไหงปาดี</p>
    </div>
</body>
</html>
